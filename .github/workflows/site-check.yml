name: site-check

# The new Astro site: build, then the copy and facts gate (style, facts, spelling, grammar).
# A branch that passes is deployed as a preview at https://<branch>.manoharpapasani.pages.dev;
# production (main) keeps deploying from deploy-cloudflare.yml until the switch.
on:
  push:
    branches-ignore: [main]
    paths: ["site/**", "data/**", ".github/workflows/site-check.yml"]
  # Task branches are checked by their push run (its result shows on their pull request); a pull
  # request runs its own check only into main, where the lane is merged.
  pull_request:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/site-check.yml"]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: site-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Build
        run: npx astro build
      - name: Unit tests
        run: node --test tests/unit/*.test.mjs
      - name: Playwright version
        id: pwv
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pwv.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the browser's system packages (browser cached)
        if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
      - name: Copy and facts gate
        run: node scripts/check-copy.mjs --grammar
      - name: Deploy preview
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=manoharpapasani --branch=${{ github.ref_name }}
