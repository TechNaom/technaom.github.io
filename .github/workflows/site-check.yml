name: site-check

# The new Astro site: build, then the copy and facts gate (style, facts, spelling, grammar).
# A branch that passes is deployed as a preview at https://<branch>.manoharpapasani.pages.dev;
# production (main) keeps deploying from deploy-cloudflare.yml until the switch.
on:
  push:
    branches-ignore: [main]
    paths: ["site/**", "data/**", ".github/workflows/site-check.yml"]
  pull_request:
    paths: ["site/**", "data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Build
        run: npx astro build
      - name: Copy and facts gate
        run: node scripts/check-copy.mjs --grammar
      - name: Deploy preview
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=manoharpapasani --branch=${{ github.ref_name }}
